name: Claude Code

# `@claude` in an issue (title or body), an issue/PR comment or a PR review
# runs Claude Code against the repo. It answers in the thread and, when a
# change is asked for, pushes a `claude/…` branch and opens a PR - it never
# commits to master. Writes go through the Claude GitHub App's token (the
# `id-token: write` exchange), so the job's own permissions stay read-only.
# Nothing is started besides `npm ci`: the dev stack needs Docker (postgres,
# redis) and the runner has none, so Claude gets typecheck/lint/format and
# the unit tests that don't drive a browser.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # apps/worker/src/regions.browser.test.ts needs a Chromium that is
          # not installed here; a full `npm test` fails on that one file.
          claude_args: |
            --allowedTools "Bash(npm run typecheck),Bash(npm run lint),Bash(npm run format:*),Bash(npm test:*)"
